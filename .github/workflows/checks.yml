name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export -w @veynoa/mobile
        env:
          EXPO_NO_TELEMETRY: 1
      - run: npm run dry-run -w @veynoa/ai-gateway
        env:
          WRANGLER_SEND_METRICS: false
